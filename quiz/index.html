<style>
:root{--ink:#0E0F14;--ink2:#2A2F3A;--mut:#6B7280;--line:#E6E8EE;--soft:#F5F6FA;--acc:#FFC700;--acc2:#1B6EF3;--good:#0FA36B}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.5;font-size:17px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;max-width:560px;margin:0 auto}
.top b{font-family:Poppins;font-size:15px}.top .back{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mut);padding:4px 8px}
.bar{height:6px;background:var(--line);max-width:560px;margin:0 auto 6px;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.wrap{max-width:560px;margin:0 auto;padding:26px 20px 60px}
h1{font-family:Poppins;font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.12;margin:0 0 14px}
h2{font-family:Poppins;font-weight:700;font-size:clamp(22px,5.6vw,28px);line-height:1.2;margin:0 0 10px}
.kicker{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acc2);margin-bottom:10px}
.sub{color:var(--mut);margin:0 0 22px}
.opts{display:grid;gap:10px}.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px 18px;font:inherit;font-weight:500;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--ink)}.opt.sel{border-color:var(--ink);background:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two .opt{text-align:center;padding:26px 10px;font-family:Poppins;font-weight:700;font-size:20px}
.btn{display:block;width:100%;background:var(--ink);color:#fff;font-family:Poppins;font-weight:700;font-size:18px;padding:17px;border-radius:14px;border:0;cursor:pointer;margin-top:18px}
.btn.acc{background:var(--acc);color:var(--ink)}.btn:disabled{opacity:.35;cursor:default}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.scale .opt{text-align:center;padding:18px 0;font-family:Poppins;font-weight:700;font-size:20px}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:6px}
.info{background:var(--ink);color:#fff;border-radius:18px;padding:24px 22px;margin:0 0 18px}.info .kicker{color:var(--acc)}.info p{margin:0 0 10px;color:#D7DAE2}
.hero{text-align:center;padding-top:20px}.hero .kicker{color:var(--mut)}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--mut);margin-bottom:16px}
.bars{margin:18px 0}.row{margin:12px 0}.row .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.row .tr{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.row .tr i{display:block;height:100%;background:var(--acc2);width:0;transition:width 1s ease}
.row.weak .tr i{background:#E0345C}.row.weak .lbl b{color:#E0345C}
.card{border:2px solid var(--acc);border-radius:18px;padding:20px;margin-top:18px;box-shadow:0 20px 60px rgba(0,0,0,.08)}
.card small{color:var(--mut)}
input[type=email]{width:100%;font:inherit;font-size:17px;padding:16px;border:2px solid var(--line);border-radius:14px;margin-top:10px}
.fine{font-size:12px;color:var(--mut);margin-top:10px;text-align:center}
.spin{width:64px;height:64px;border:6px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:30px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.hide{display:none}

<div class="top"><button class="back" id="back" aria-label="Back">‹</button><b>Charisma Cheat Codes</b><span style="width:36px"></span></div>
<div class="bar"><i id="prog"></i></div>
<div class="wrap" id="app"></div>

<script>
// ---------- the quiz (Vocal Image funnel mold: profile → science → yes/no traits → self-rating → analysis → result → email → offer) ----------
const MODULES = [
  {k:"first", name:"First impressions", code:"Code 01 · The Seven-Second Setting", desc:"How you enter, the first hello, the name anchor. Most of the judgment happens before you've said anything interesting."},
  {k:"conv",  name:"Conversation engine", code:"Code 09 · Threading", desc:"Threading, open loops, the 2:1 ratio, exit on the peak. Conversations don't die because people are boring — they die because nobody is steering."},
  {k:"voice", name:"Voice & delivery", code:"Code 19 · Slow Is Status", desc:"Pace, downward endings, the pause before the point. Your tone decides whether they listen or forget."},
  {k:"pres",  name:"Presence & body language", code:"Code 27 · Stillness Is Power", desc:"Stillness, space, eye contact with a rhythm, facing the door you want open."},
  {k:"story", name:"Storytelling", code:"Code 34 · Build the Bank", desc:"A story bank, three beats, one vivid detail. The difference between 'interesting' and 'forgettable' at dinner."}
];
const S = [
  {t:"hero"},
  {t:"single", sec:"Your profile", q:"What is your age?", sub:"We use this to calibrate the rooms we ask about.", o:["18–24","25–34","35–44","45–54","55+"]},
  {t:"single", sec:"Your profile", q:"What do you want most?", sub:"Let's find the main area to focus on.", o:["Conversations that don't die after two exchanges","To hold a table, not just survive it","Dating — first impressions that land","Meetings and career rooms","Making new friends as an adult","Speaking in front of people"], tag:["conv","pres","first","voice","first","voice"]},
  {t:"multi", sec:"Your profile", q:"Where does it happen most?", sub:"Pick every room that applies.", o:["Parties","Work meetings","Dates","Dinners with friends","Networking events","Family gatherings"]},
  {t:"info", sec:"Why this works", h:"Charisma isn't a personality type.", p:["It's about 40 small skills — how you enter a room, when you pause, how you thread a conversation, what you do with silence.","'Just be more confident' fails for the same reason 'just be taller' does: it names the outcome and skips the mechanism.","Skills respond to reps. Ten minutes a day. This quiz finds the one skill that is quietly costing you the most."], btn:"Let's find it"},
  {t:"yn", sec:"Patterns", q:"You rehearse a sentence in your head — and by the time it's ready, the moment has passed.", tag:"conv"},
  {t:"yn", sec:"Patterns", q:"You've had the better story and someone louder got the room.", tag:"voice"},
  {t:"yn", sec:"Patterns", q:"At parties you check your phone so you don't have to walk over to a group.", tag:"first"},
  {t:"yn", sec:"Patterns", q:"People interrupt you mid-sentence more than you interrupt them.", tag:"voice"},
  {t:"yn", sec:"Patterns", q:"You replay conversations at night and find the line you should have said.", tag:"conv"},
  {t:"yn", sec:"Patterns", q:"When someone tells a story, you rarely have one ready to trade back.", tag:"story"},
  {t:"yn", sec:"Patterns", q:"You're told you 'seem serious' or 'hard to read' by people who don't know you well.", tag:"pres"},
  {t:"info", sec:"Almost there", h:"Now rate yourself on the five skill modules.", p:["Be honest — the plan is built from the weakest one, not the strongest."], btn:"Continue"},
  {t:"scale", sec:"Self-rating", q:"Walking into a room of strangers and saying the first hello.", tag:"first"},
  {t:"scale", sec:"Self-rating", q:"Keeping a conversation alive without interrogating the other person.", tag:"conv"},
  {t:"scale", sec:"Self-rating", q:"Speaking slowly, clearly, and being listened to.", tag:"voice"},
  {t:"scale", sec:"Self-rating", q:"Standing and holding space in a group without fidgeting or shrinking.", tag:"pres"},
  {t:"scale", sec:"Self-rating", q:"Telling a short story that makes the table lean in.", tag:"story"},
  {t:"analyze"},
  {t:"email"},
  {t:"result"}
];
let i = 0, ans = {}, multi = new Set();
const score = {first:0, conv:0, voice:0, pres:0, story:0};   // higher = more friction
const app = document.getElementById('app'), prog = document.getElementById('prog');
const qCount = S.filter(s=>['single','multi','yn','scale'].includes(s.t)).length;

function render(){
  const s = S[i]; app.innerHTML = ''; document.getElementById('back').style.visibility = i>0 && s.t!=='result' ? 'visible':'hidden';
  const done = S.slice(0,i).filter(x=>['single','multi','yn','scale'].includes(x.t)).length; prog.style.width = Math.min(100, Math.round(done/qCount*100))+'%';
  window.scrollTo(0,0);
  if(s.t==='hero'){ app.innerHTML = `<div class="hero"><div class="pill">2-minute quiz · 40 skills · 1 blind spot</div><h1>Smartest person at the table.<br>Nobody noticed.</h1><p class="sub">Find your charisma blind spot in 2 minutes.</p><div class="two"><button class="opt" data-v="Male">Male</button><button class="opt" data-v="Female">Female</button></div><p class="fine">No sign-up to start · results are private</p></div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans.gender=b.dataset.v; fbq('trackCustom','QuizStart'); next();}); return; }
  if(s.t==='single'){ app.innerHTML = `<div class="kicker">${s.sec}</div><h2>${s.q}</h2><p class="sub">${s.sub||''}</p><div class="opts">${s.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[i]=s.o[b.dataset.k]; if(s.tag) score[s.tag[b.dataset.k]]+=2; next();}); return; }
  if(s.t==='multi'){ multi=new Set(); app.innerHTML = `<div class="kicker">${s.sec}</div><h2>${s.q}</h2><p class="sub">${s.sub||''}</p><div class="opts">${s.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div><button class="btn" id="cont" disabled>Continue</button>`;
    const c=app.querySelector('#cont'); app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{b.classList.toggle('sel'); multi.has(b.dataset.k)?multi.delete(b.dataset.k):multi.add(b.dataset.k); c.disabled=!multi.size;}); c.onclick=()=>{ans[i]=[...multi].map(k=>s.o[k]); next();}; return; }
  if(s.t==='info'){ app.innerHTML = `<div class="kicker">${s.sec}</div><div class="info"><h2>${s.h}</h2>${s.p.map(p=>`<p>${p}</p>`).join('')}</div><button class="btn acc" id="cont">${s.btn}</button>`; app.querySelector('#cont').onclick=next; return; }
  if(s.t==='yn'){ app.innerHTML = `<div class="kicker">${s.sec}</div><h2>${s.q}</h2><p class="sub">Does this sound like you?</p><div class="two"><button class="opt" data-v="0">No</button><button class="opt" data-v="1">Yes</button></div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.v; score[s.tag]+= +b.dataset.v*3; next();}); return; }
  if(s.t==='scale'){ app.innerHTML = `<div class="kicker">${s.sec}</div><h2>${s.q}</h2><p class="sub">How comfortable are you, 1–5?</p><div class="scale">${[1,2,3,4,5].map(n=>`<button class="opt" data-v="${n}">${n}</button>`).join('')}</div><div class="ends"><span>I avoid it</span><span>Effortless</span></div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ans[i]=+b.dataset.v; score[s.tag]+= (5-b.dataset.v)*1.5; next();}); return; }
  if(s.t==='analyze'){ app.innerHTML = `<div class="hero"><div class="spin"></div><h2 id="an">Reading your patterns…</h2><p class="sub" id="an2">Comparing against the 40 codes</p></div>`;
    const msgs=["Reading your patterns…","Scoring the five modules…","Finding the one that costs you the most…","Building your Day 1…"]; let k=0; const iv=setInterval(()=>{k++; if(k<msgs.length) document.getElementById('an').textContent=msgs[k]; else {clearInterval(iv); next();}}, 900); return; }
  if(s.t==='email'){ const w = weakest(); app.innerHTML = `<div class="kicker">Your result is ready</div><h2>Your blind spot is <span style="color:#E0345C">${w.name.toLowerCase()}</span>.</h2><p class="sub">Where should we send your full profile and your Day 1 drill? (It's one email, then the drill — no sequence you didn't ask for.)</p><form id="f"><input type="email" id="em" placeholder="you@email.com" required autocomplete="email"><button class="btn acc" type="submit">Show my profile</button></form><p class="fine">Or <a href="#" id="skip">skip and see the result</a></p>`;
    app.querySelector('#f').onsubmit=e=>{e.preventDefault(); const em=app.querySelector('#em').value; ans.email=em; try{ fbq('track','Lead'); }catch(_){}
      try{ fetch('https://assets.mailerlite.com/jsonp/2550922/forms/vKIDP8/subscribe',{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'fields[email]='+encodeURIComponent(em)+'&fields[blind_spot]='+encodeURIComponent(w.name)}); }catch(_){}
      next();}; app.querySelector('#skip').onclick=e=>{e.preventDefault(); next();}; return; }
  if(s.t==='result'){ const w=weakest(), tot=Object.values(score).reduce((a,b)=>a+b,0)||1;
    app.innerHTML = `<div class="kicker">Your charisma profile</div><h1 style="font-size:clamp(26px,6.5vw,36px)">Blind spot: ${w.name}</h1><p class="sub">${w.desc}</p>
    <div class="bars">${MODULES.map(m=>{const fr=Math.max(28, Math.round(100-(score[m.k]/Math.max(...Object.values(score),1))*70)); return `<div class="row ${m.k===w.k?'weak':''}"><div class="lbl"><span>${m.name}</span><b>${fr}%</b></div><div class="tr"><i data-w="${fr}"></i></div></div>`}).join('')}</div>
    <div class="info"><div class="kicker">Your Day 1</div><h2 style="color:#fff">${w.code}</h2><p>Ten minutes, alone or in a cheap room. The system sequences all 40 codes over 30 days — but yours starts here, because this is the one holding the others back.</p></div>
    <div class="card"><div class="kicker">The plan that fixes it</div><h2>Charisma Cheat Codes — the 40-drill system</h2><img class="bundle" src="../bundle.jpg" alt="The Charisma Cheat Codes system"><p style="margin:6px 0 4px"><b>$27</b> <s style="color:var(--mut)">$47</s> · one-time · 60-day keep-everything guarantee</p><small>Manual (40 codes, one page each) · 30-Day Reps Calendar · 40 Drill Cards · 8 Audio Drill Tracks</small>
    <a class="btn acc" style="text-decoration:none;text-align:center" href="https://whop.com/checkout/ch_gcRBS45DCYhy2nG/?utm_source=quiz&utm_content=${w.k}" onclick="fbq('track','InitiateCheckout')">Start my 30 days — $27</a>
    <p class="fine" style="margin-top:12px">Instant access · one-time payment · if rooms don't feel different in 60 days, one email — refund — and you keep everything.</p></div>
    <p class="fine">Skill training, not therapy or medical advice. Results depend on doing the reps.</p>`;
    setTimeout(()=>app.querySelectorAll('.tr i').forEach(b=>b.style.width=b.dataset.w+'%'),60); try{ fbq('trackCustom','QuizComplete',{blind_spot:w.k}); }catch(_){} return; }
}
function weakest(){ let best=MODULES[0]; for(const m of MODULES) if(score[m.k]>score[best.k]) best=m; return best; }
function next(){ i=Math.min(i+1,S.length-1); render(); }
document.getElementById('back').onclick=()=>{ if(i>0){ i--; render(); } };
render();
</script>
